# One-click deploy on Render.com — connect this repo, Render auto-detects this file
services:
  - type: web
    name: ai-secops-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt fastapi uvicorn python-multipart openai
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false    # optional: set in Render dashboard to enable the LLM analyst
